apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "opnsense-exporter.fullname" . }}-test-version"
  labels:
    {{- include "opnsense-exporter.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  automountServiceAccountToken: false
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: version
      image: {{ include "opnsense-exporter.image" . | quote }}
      imagePullPolicy: {{ .Values.image.pullPolicy }}
      args:
        - "--version"
      securityContext:
        {{- include "opnsense-exporter.securityContext" . | nindent 8 }}
