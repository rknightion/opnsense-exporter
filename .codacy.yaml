---
# Codacy repository configuration.
# Exclude generated, vendored, and scratch/test-fixture paths from analysis so
# tools don't flag code we don't own or maintain by hand.
exclude_paths:
  - "vendor/**"
  - "tools/**/testdata/**"
  - "docs/superpowers/**"
# Note: repo-level path excludes also neutralise default-on tools (e.g.
# PHP_CodeSniffer) that run even when not listed in the org coding standard.
