<?xml version="1.0" encoding="UTF-8"?>
<!--
  Social / OpenGraph card for the OPNsense Exporter docs site and GitHub repo.

  Source of truth for docs/assets/social-card.png. Regenerate after editing:

      rsvg-convert -w 1200 -h 630 docs/assets/social-card.svg -o docs/assets/social-card.png

  Sized 1200x630 to match the og:image:width / og:image:height that docs/overrides/main.html
  declares. Keep text inside the 80px margin: GitHub crops a social preview to 2:1, which
  trims a few pixels off the top and bottom of a 1.905:1 image.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="55%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#3730a3"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative shield, echoing the docs logo (material/shield-lock-outline). -->
  <g opacity="0.08" transform="translate(905 129) scale(15.5)">
    <path fill="#ffffff" d="M12 1 3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/>
  </g>

  <!-- Eyebrow -->
  <text x="80" y="150" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="26" font-weight="bold" letter-spacing="4.5" fill="#a5b4fc">PROMETHEUS · OPENTELEMETRY · LOKI</text>

  <!-- Title -->
  <text x="80" y="272" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="104" font-weight="bold" fill="#ffffff">OPNsense Exporter</text>

  <rect x="80" y="312" width="620" height="5" rx="2.5" fill="url(#rule)"/>

  <!-- Subtitle -->
  <text x="80" y="392" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="42" fill="#e0e7ff">Metrics, logs and flow telemetry for OPNsense</text>

  <!-- Feature line -->
  <text x="80" y="462" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="29" fill="#a5b4fc">60+ collectors · OTLP metrics &amp; logs · Syslog receiver · NetFlow &amp; Zenarmor</text>

  <!-- Footer -->
  <rect x="80" y="540" width="6" height="34" rx="3" fill="#818cf8"/>
  <text x="104" y="567" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="28" font-weight="bold" fill="#ffffff">m7kni.io/opnsense-exporter</text>
  <text x="1120" y="567" text-anchor="end" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="26" fill="#818cf8">Apache-2.0</text>
</svg>
