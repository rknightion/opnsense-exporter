version: "2"
linters:
  enable:
    - misspell
    - revive
  disable:
    - unused
  settings:
    errcheck:
      exclude-functions:
        - (net/http.ResponseWriter).Write
        - (github.com/go-kit/log.Logger).Log
    misspell:
      ignore-rules:
        # ECT(0)/ECT(1) — ECN-Capable Transport codepoints (RFC 3168), not a typo
        # of "etc"; misspell would otherwise rewrite the tcp ECN comments.
        - ect
    revive:
      rules:
        - name: unused-parameter
          severity: warning
          disabled: true
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - errcheck
        path: _test.go
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  # Enable gofmt (with -s simplify) so `golangci-lint run` gates formatting in CI, not
  # just the local `make lint` write step (#132). Matches `gofmt -s` used by make lint.
  enable:
    - gofmt
  settings:
    gofmt:
      simplify: true
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
