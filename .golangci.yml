version: "2"
linters:
  enable:
    - misspell
    - revive
  disable:
    - unused
  settings:
    errcheck:
      exclude-functions:
        - (net/http.ResponseWriter).Write
        - (github.com/go-kit/log.Logger).Log
    revive:
      rules:
        - name: unused-parameter
          severity: warning
          disabled: true
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - errcheck
        path: _test.go
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  # Enable gofmt (with -s simplify) so `golangci-lint run` gates formatting in CI, not
  # just the local `make lint` write step (#132). Matches `gofmt -s` used by make lint.
  enable:
    - gofmt
  settings:
    gofmt:
      simplify: true
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
