name: Enhancement suggestion
title: "[FEATURE]: "
description: Provide supporting details for a feature
labels: ["feature"]

body:
  - type: markdown
    attributes:
      value: |
        **Do not paste API keys, secrets, tokens, or unredacted configuration.**

  - type: textarea
    id: feature
    attributes:
      label: What would you like to be added?
      description: |
        Please describe what you'd like to be added.
    validations:
      required: true

  - type: textarea
    id: rationale
    attributes:
      label: Why is this needed?
    validations:
      required: true

  - type: textarea
    id: implementation-details
    attributes:
      label: Any implementation details that are not related to source code may be included here.
    validations:
      required: false
