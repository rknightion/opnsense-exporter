name: grafana-sync

# Keep the m7kni Grafana stack in step with this repository's generated Grafana
# artifacts. Two deliberately different delivery paths:
#
#   dashboards -> a commit into rknightion/gc-gitsync-m7kni, because that repo is a
#                 Grafana GitSync source and Grafana writes UI saves back into it. A
#                 direct API push would create out-of-band edits and make the repo and
#                 the stack diverge with no way to tell which is right.
#   rules      -> `gcx resources push`, because GitSync does not manage alert or
#                 recording rules at all.
#
# Prune runs before push: `gcx resources push` is create-or-update only, so a rule
# deleted from the generator would otherwise keep evaluating forever.

on:
  push:
    branches: [main]
    paths:
      - 'grafana/**'
      - 'scripts/grafana-prune-rules.py'
      - '.github/workflows/grafana-sync.yml'
  workflow_dispatch:

permissions:
  contents: read

# Never let two syncs write the stack at once; never cancel one mid-write.
concurrency:
  group: grafana-sync
  cancel-in-progress: false

env:
  GCX_VERSION: '1.0.0'
  GCX_SHA256: 'c88c65958d19d83dc3a192a2a5037e08307a9c776019f24249b89f369c9c4d41'
  # Renamed with the project (was opnsense-alerts / opnsense-exporter-health-alerts).
  # Unlike the dashboard UIDs these are safe to move — nothing deep-links a folder —
  # but `gcx resources push --prune` only prunes WITHIN the folders it is given, so
  # the two old folders must be deleted by hand or their rules keep firing alongside
  # the new ones.
  OPS_FOLDER: opnsense2otel-alerts
  HEALTH_FOLDER: opnsense2otel-health-alerts

jobs:
  dashboards:
    name: publish dashboards to GitSync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The default GITHUB_TOKEN cannot write to another repository, hence the PAT.
      - name: check out the GitSync repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: rknightion/gc-gitsync-m7kni
          token: ${{ secrets.GITSYNC_PAT }}
          path: gitsync

      # The basenames still spell the pre-rename project name ON PURPOSE: with GitSync
      # the filename IS the resource name, i.e. the dashboard UID. Renaming them is a
      # delete-and-recreate that breaks every bookmark and every alert's
      # __dashboardUid__ deep-link. See the note on MAIN_UID in grafana/uids.py.
      - name: copy the generated dashboards into place
        run: |
          cp grafana/dashboard.json        gitsync/networking/opnsense-exporter.json
          cp grafana/dashboard-health.json gitsync/networking/opnsense-exporter-health.json

      - name: commit and push
        working-directory: gitsync
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "dashboards already match the stack source"
            exit 0
          fi
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -am "Sync opnsense2otel dashboards from ${GITHUB_REPOSITORY}@${GITHUB_SHA}"
          # Grafana commits UI saves into this repo on its own, so a push can lose a
          # race with the stack. Rebase and retry rather than failing the sync.
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            echo "push rejected (attempt ${attempt}) — rebasing onto origin/main"
            git pull --rebase origin main
          done
          echo "::error::could not push dashboards to gc-gitsync-m7kni after 3 attempts"
          exit 1

  rules:
    name: publish alert and recording rules
    runs-on: ubuntu-latest
    env:
      GRAFANA_SERVER: ${{ vars.GRAFANA_SERVER }}
      GRAFANA_TOKEN: ${{ secrets.GRAFANA_TOKEN }}
      GRAFANA_STACK_ID: ${{ vars.GRAFANA_STACK_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: install gcx
        run: |
          set -euo pipefail
          curl -fsSL -o gcx.tgz \
            "https://github.com/grafana/gcx/releases/download/v${GCX_VERSION}/gcx_${GCX_VERSION}_linux_amd64.tar.gz"
          echo "${GCX_SHA256}  gcx.tgz" | sha256sum -c -
          tar -xzf gcx.tgz gcx
          sudo install -m 0755 gcx /usr/local/bin/gcx
          rm -f gcx gcx.tgz
          gcx version

      # The committed manifests are deliberately generic — the IRM label contract
      # (domain=infra, page=true on critical) is deployment-specific and is added at
      # push time, never committed. This rewrites the directory in the ephemeral
      # checkout only.
      - name: regenerate the manifests with the stack label contract
        run: python3 grafana/alerts/build_rules.py --stack

      - name: list the rules this repository defines
        run: |
          set -euo pipefail
          python3 - > expected-rules.txt <<'PY'
          import glob, json
          for path in sorted(glob.glob("grafana/alerts/grafana-managed/*.json")):
              with open(path, encoding="utf-8") as fh:
                  doc = json.load(fh)
              if doc.get("kind") in ("AlertRule", "RecordingRule"):
                  print(doc["metadata"]["name"])
          PY
          echo "this repository defines $(wc -l < expected-rules.txt) rules"

      - name: prune rules the repository no longer defines
        run: |
          python3 scripts/grafana-prune-rules.py \
            --folder "${OPS_FOLDER}" --folder "${HEALTH_FOLDER}" \
            --keep-file expected-rules.txt

      # No --omit-manager-fields. The live rules already carry managedBy=kubectl /
      # managerId=gcx from how they were first pushed; stripping the manager fields
      # sends provenance '' against a stack that holds 'api' and 409s every rule.
      - name: push rules
        run: gcx resources push -p grafana/alerts/grafana-managed --on-error abort
