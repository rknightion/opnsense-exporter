name: grafana-sync

# Keep the m7kni Grafana stack in step with this repository's generated Grafana
# artifacts. Two deliberately different delivery paths:
#
#   dashboards -> a commit into m7kni/gc-gitsync-m7kni, because that repo is a
#                 Grafana GitSync source and Grafana writes UI saves back into it. A
#                 direct API push would create out-of-band edits and make the repo and
#                 the stack diverge with no way to tell which is right.
#   rules      -> `gcx resources push`, because GitSync does not manage alert or
#                 recording rules at all.
#
# Prune runs before push: `gcx resources push` is create-or-update only, so a rule
# deleted from the generator would otherwise keep evaluating forever.

on:
  push:
    branches: [main]
    paths:
      - 'grafana/**'
      - 'scripts/grafana-prune-rules.py'
      - '.github/workflows/grafana-sync.yml'
  workflow_dispatch:

permissions:
  contents: read

# Never let two syncs write the stack at once; never cancel one mid-write.
concurrency:
  group: grafana-sync
  cancel-in-progress: false

env:
  GCX_VERSION: '1.0.0'
  GCX_SHA256: 'c88c65958d19d83dc3a192a2a5037e08307a9c776019f24249b89f369c9c4d41'
  # RENAMING EITHER OF THESE IS A THREE-STEP OPERATION. A folder's metadata.name IS its
  # UID, and `gcx resources push` fails with a bare `403` — no detail, nothing deployed —
  # unless BOTH of the following already hold for the new folder:
  #
  #   1. It EXISTS. GRAFANA_TOKEN cannot create a folder.
  #   2. Its service account has Admin ON THAT FOLDER. Folder permissions are per-folder
  #      and are NOT inherited: sa-1-github-repo-pushes is org-role Viewer and works
  #      only through per-folder grants, so a freshly created folder 403s exactly like a
  #      missing one. This cost a second failed sync after the folder already existed.
  #
  # So, as admin, before merging a rename:
  #   gcx api /api/folders -X POST --data '{"uid":"<new>","title":"<Title>"}'
  #   gcx api /api/access-control/folders/<new>/users/<sa-id> -X POST --data '{"permission":"Admin"}'
  # and afterwards delete the old folder — `--prune` only prunes within the folders it
  # is given, so a stranded one keeps evaluating its own copy of every rule.
  #
  # A rule keeps its UID across a folder move, so the push MOVES rules rather than
  # duplicating them; there is no window of double alerting.
  #
  # (Unlike the dashboard UIDs in grafana/uids.py, nothing deep-links a folder, so the
  # rename itself is safe — permissions are the whole constraint.)
  OPS_FOLDER: opnsense2otel-alerts
  HEALTH_FOLDER: opnsense2otel-health-alerts

jobs:
  dashboards:
    name: publish dashboards to GitSync
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # exchanged for a tailnet identity and an OpenBao token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The default GITHUB_TOKEN cannot write to another repository. This used to be
      # GITSYNC_PAT; that PAT was revoked in the 2026-08-08 secret sweep and this lane
      # was the one consumer the sweep missed, so it failed with `Bad credentials` for
      # two days while every other gate stayed green (gc-gitsync-m7kni#17).
      #
      # The minted token carries contents:write on gc-gitsync-m7kni ONLY — not on this
      # repository — and expires in an hour. contents:write is what a `git push` needs;
      # note this lane pushes commits rather than firing a repository_dispatch.
      - name: Mint a scoped GitSync token
        id: bao
        uses: rknightion/.github/.github/actions/broker-token@bc58399e49a8d8131a379f530fffe8c9659667f9
        with:
          permission-set: gitsync
          # One shared permission set — all three publisher repos target the same hub
          # repo — but a role per repo to pin repository_id, so these names diverge and
          # `role` MUST be passed. Omitting it defaults the role to `gitsync`, which
          # does not exist, and auth/gha/login answers 400.
          role: gitsync-opnsense2otel
          tailscale-client-id: ${{ secrets.TS_WIF_CLIENT_ID }}
          tailscale-audience: ${{ secrets.TS_WIF_AUDIENCE }}

      - name: check out the GitSync repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: m7kni/gc-gitsync-m7kni
          token: ${{ steps.bao.outputs.token }}
          path: gitsync

      # The basenames still spell the pre-rename project name ON PURPOSE: with GitSync
      # the filename IS the resource name, i.e. the dashboard UID. Renaming them is a
      # delete-and-recreate that breaks every bookmark and every alert's
      # __dashboardUid__ deep-link. See the note on MAIN_UID in grafana/uids.py.
      - name: copy the generated dashboards into place
        run: |
          cp grafana/dashboard.json        gitsync/networking/opnsense-exporter.json
          cp grafana/dashboard-health.json gitsync/networking/opnsense-exporter-health.json

      - name: commit and push
        id: push
        working-directory: gitsync
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "dashboards already match the stack source"
            echo "ref=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -am "Sync opnsense2otel dashboards from ${GITHUB_REPOSITORY}@${GITHUB_SHA}"
          # Grafana commits UI saves into this repo on its own, so a push can lose a
          # race with the stack. Rebase and retry rather than failing the sync.
          for attempt in 1 2 3; do
            if git push; then
              echo "ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "push rejected (attempt ${attempt}) — rebasing onto origin/main"
            git pull --rebase origin main
          done
          echo "::error::could not push dashboards to gc-gitsync-m7kni after 3 attempts"
          exit 1

      # A successful `git push` is NOT a deploy. GitSync pulls asynchronously and
      # validates each file against the Dashboard schema; a file that fails validation
      # is skipped and the repository merely reports CompletedWithWarnings. That is how
      # dashboard-health.json sat rejected for two days, 12 panels behind, with every
      # gate in this repository green (#616). Everything below closes that loop.
      - name: install gcx
        if: steps.push.outputs.ref != ''
        run: |
          set -euo pipefail
          curl -fsSL -o gcx.tgz \
            "https://github.com/grafana/gcx/releases/download/v${GCX_VERSION}/gcx_${GCX_VERSION}_linux_amd64.tar.gz"
          echo "${GCX_SHA256}  gcx.tgz" | sha256sum -c -
          tar -xzf gcx.tgz gcx
          sudo install -m 0755 gcx /usr/local/bin/gcx
          rm -f gcx gcx.tgz

      - name: verify Grafana actually applied the dashboards
        if: steps.push.outputs.ref != ''
        env:
          GRAFANA_SERVER: ${{ vars.GRAFANA_SERVER }}
          GRAFANA_TOKEN: ${{ secrets.GRAFANA_TOKEN }}
          GRAFANA_STACK_ID: ${{ vars.GRAFANA_STACK_ID }}
          PUSHED_REF: ${{ steps.push.outputs.ref }}
        run: |
          python3 scripts/verify-gitsync.py --ref "$PUSHED_REF" \
            --file networking/opnsense-exporter.json=grafana/dashboard.json \
            --file networking/opnsense-exporter-health.json=grafana/dashboard-health.json

  rules:
    name: publish alert and recording rules
    runs-on: ubuntu-latest
    env:
      GRAFANA_SERVER: ${{ vars.GRAFANA_SERVER }}
      GRAFANA_TOKEN: ${{ secrets.GRAFANA_TOKEN }}
      GRAFANA_STACK_ID: ${{ vars.GRAFANA_STACK_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: install gcx
        run: |
          set -euo pipefail
          curl -fsSL -o gcx.tgz \
            "https://github.com/grafana/gcx/releases/download/v${GCX_VERSION}/gcx_${GCX_VERSION}_linux_amd64.tar.gz"
          echo "${GCX_SHA256}  gcx.tgz" | sha256sum -c -
          tar -xzf gcx.tgz gcx
          sudo install -m 0755 gcx /usr/local/bin/gcx
          rm -f gcx gcx.tgz
          gcx version

      # The committed manifests are deliberately generic — the IRM label contract
      # (domain=infra, page=true on critical) is deployment-specific and is added at
      # push time, never committed. This rewrites the directory in the ephemeral
      # checkout only.
      - name: regenerate the manifests with the stack label contract
        run: python3 grafana/alerts/build_rules.py --stack

      - name: list the rules this repository defines
        run: |
          set -euo pipefail
          python3 - > expected-rules.txt <<'PY'
          import glob, json
          for path in sorted(glob.glob("grafana/alerts/grafana-managed/*.json")):
              with open(path, encoding="utf-8") as fh:
                  doc = json.load(fh)
              if doc.get("kind") in ("AlertRule", "RecordingRule"):
                  print(doc["metadata"]["name"])
          PY
          echo "this repository defines $(wc -l < expected-rules.txt) rules"

      - name: prune rules the repository no longer defines
        run: |
          python3 scripts/grafana-prune-rules.py \
            --folder "${OPS_FOLDER}" --folder "${HEALTH_FOLDER}" \
            --keep-file expected-rules.txt

      # No --omit-manager-fields. The live rules already carry managedBy=kubectl /
      # managerId=gcx from how they were first pushed; stripping the manager fields
      # sends provenance '' against a stack that holds 'api' and 409s every rule.
      - name: push rules
        run: gcx resources push -p grafana/alerts/grafana-managed --on-error abort
