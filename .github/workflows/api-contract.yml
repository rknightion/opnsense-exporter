name: OPNsense API Contract

on:
  schedule:
    - cron: '17 6 * * *'   # daily 06:17 UTC
  workflow_dispatch:
    inputs:
      extra_refs:
        description: 'Space-separated extra core/plugins refs to also check (e.g. a beta tag)'
        required: false
        default: ''
  pull_request:
    paths:
      - 'opnsense/client.go'
      - 'opnsense/contract.go'
      - 'cmd/apicontract/**'
      - 'tools/opnsense_api_contract/**'
      - '.github/workflows/api-contract.yml'

permissions:
  contents: read

# The docs repo supplies the PHP parser, whose modules extract.py imports (i.e.
# executes) — so it's a code dependency, not just data. Pin to a specific commit SHA
# rather than mutable `master` to close the unpinned-code channel (#130); Renovate's
# custom manager below bumps it. The `--min` floor still catches parser breakage.
env:
  # renovate: datasource=git-refs depName=opnsense-docs packageName=https://github.com/opnsense/docs currentValue=master
  OPNSENSE_DOCS_REF: c296d26a865320ac025f3aa63b0bf56f9831bf82

jobs:
  contract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.x'

      - name: Install parser dependencies
        run: python -m pip install --quiet -r tools/opnsense_api_contract/requirements.txt

      - name: Clone opnsense/docs (parser) at pinned SHA
        run: |
          set -euo pipefail
          mkdir -p upstream/docs
          cd upstream/docs
          git init -q
          git remote add origin https://github.com/opnsense/docs
          # Shallow-fetch exactly the pinned commit (works for a SHA; --branch does not).
          git fetch -q --depth 1 origin "$OPNSENSE_DOCS_REF"
          git checkout -q FETCH_HEAD

      # Guard the parser-contract fixture (isPost() verb detection, default-GET, the
      # mvc/app/controllers/.../Api path filter) against upstream docs-lib churn, so a
      # breaking refactor fails here instead of silently producing a wrong manifest (#136).
      - name: Run parser-contract unit tests
        env:
          OPNSENSE_DOCS_REPO: ${{ github.workspace }}/upstream/docs
        run: python -m pytest tools/opnsense_api_contract/ -q

      - name: Determine refs to check
        id: refs
        env:
          EXTRA_REFS: ${{ github.event.inputs.extra_refs }}
        run: |
          set -euo pipefail
          # latest stable/* branch by CalVer
          latest_stable=$(git ls-remote --heads https://github.com/opnsense/core 'refs/heads/stable/*' \
            | sed 's#.*refs/heads/##' | sort -V | tail -n1)
          refs="master ${latest_stable}"
          if [ -n "$EXTRA_REFS" ]; then
            refs="${refs} ${EXTRA_REFS}"
          fi
          echo "list=${refs}" >> "$GITHUB_OUTPUT"
          echo "Checking refs: ${refs}"

      - name: Extract upstream endpoints per ref
        env:
          REFS_LIST: ${{ steps.refs.outputs.list }}
        run: |
          set -euo pipefail
          mkdir -p out
          go build -o /tmp/apicontract ./cmd/apicontract
          args=()
          for ref in $REFS_LIST; do
            safe=$(echo "$ref" | tr '/' '-')
            rm -rf upstream/src
            mkdir -p upstream/src
            # core at the target ref; plugins at the same ref if it exists, else default branch.
            git clone --depth 1 --branch "$ref" https://github.com/opnsense/core "upstream/src/core"
            if ! git clone --depth 1 --branch "$ref" https://github.com/opnsense/plugins "upstream/src/plugins" 2>/dev/null; then
              echo "plugins has no '$ref' branch; using its default branch"
              git clone --depth 1 https://github.com/opnsense/plugins "upstream/src/plugins"
            fi
            # Real clones (not symlinks): os.walk does not follow symlinked dirs.
            python tools/opnsense_api_contract/extract.py \
              --docs upstream/docs --source upstream/src --min 200 \
              > "out/upstream-${safe}.json"
            args+=(--ref "${ref}=out/upstream-${safe}.json")
          done
          # Persist the arg list for the next step.
          printf '%s\n' "${args[@]}" > out/args.txt

      - name: Run contract diff
        id: diff
        run: |
          set -euo pipefail
          mapfile -t args < out/args.txt
          # apicontract writes drift/warnings step outputs to $GITHUB_OUTPUT itself.
          # Exit 0 = clean OR warnings-only (verb drift); exit 1 = missing-endpoint drift
          # (breaking, but outputs are still written first); other = error.
          if /tmp/apicontract "${args[@]}" --out out/report.md; then
            :
          else
            code=$?
            if [ "$code" -ne 1 ]; then
              echo "apicontract failed with code $code" >&2
              exit "$code"
            fi
          fi
          # Always surface the report (incl. non-failing verb warnings) in the run summary.
          cat out/report.md >> "$GITHUB_STEP_SUMMARY"
          cat out/report.md

      - name: Ensure api-drift label exists
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create api-drift --color B60205 \
            --description "OPNsense API contract drift detected by CI" 2>/dev/null || true

      - name: Open or update drift issue
        # Fire on breaking drift OR verb-drift warnings: a warnings-only run (e.g. the
        # CVE-2026-30868 GET->POST tightening) must still file/update the issue (#93).
        if: (steps.diff.outputs.drift == 'true' || steps.diff.outputs.warnings == 'true') && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          title="OPNsense API contract drift"
          # Match on the api-drift label (already filtered) + exact title only. The
          # author filter previously required .author.login == "github-actions[bot]",
          # but gh >=2.50 reports a bot author as {"login":"app/github-actions"}, so it
          # never matched and every run created a duplicate. Label+title is unique to
          # this workflow's own issues and is robust to future gh login-shape changes (#83).
          existing=$(gh issue list --label api-drift --state open --json number,title \
            --jq '.[] | select(.title == "OPNsense API contract drift") | .number' \
            | head -n1)
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file out/report.md
          else
            gh issue create --title "$title" --label api-drift --body-file out/report.md
          fi

      - name: Close drift issue when clean
        # Only close when BOTH errors and verb-drift warnings are absent, so a still-live
        # verb-drift warning can't mislabel an open drift issue as resolved (#93).
        if: steps.diff.outputs.drift == 'false' && steps.diff.outputs.warnings == 'false' && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Match on the api-drift label (already filtered) + exact title only. The
          # author filter previously required .author.login == "github-actions[bot]",
          # but gh >=2.50 reports a bot author as {"login":"app/github-actions"}, so it
          # never matched and every run created a duplicate. Label+title is unique to
          # this workflow's own issues and is robust to future gh login-shape changes (#83).
          existing=$(gh issue list --label api-drift --state open --json number,title \
            --jq '.[] | select(.title == "OPNsense API contract drift") | .number' \
            | head -n1)
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "API contract drift cleared on the latest scheduled run. Closing."
            gh issue close "$existing"
          fi

      - name: Fail the job on drift
        if: steps.diff.outputs.drift == 'true'
        run: |
          echo "API contract drift detected (see the run summary / the api-drift issue)." >&2
          exit 1
