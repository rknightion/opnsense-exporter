# Automatic release candidates. On every push to main that passes CI, cut
# vX.Y.Z-rc.N against the version release-please is already staging in its open
# release PR, then publish the image, chart and binaries for it.
#
# The stable release path (release-please.yml) is untouched: it still opens and
# maintains the release PR, and a stable release still requires an explicit
# merge. The RC path never writes to the changelog or the release PR.
name: auto-rc

# Fires off CI's completion rather than the push itself. The old `push:` trigger
# started this workflow immediately and then burned a runner slot in
# `rc / wait-for-ci` polling for a CI run still queued behind it — 20.6
# runner-hours of pure polling fleet-wide, and 5 of 17 in-flight jobs at one
# sample. workflow_run fires only once CI has a verdict.
#
# `workflows:` matches the workflow's `name:` field, NOT its filename. If that
# name changes this silently stops firing and RCs stop being cut, with no error.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  # Never cancel a half-published RC; serialize instead.
  group: auto-rc
  cancel-in-progress: false

jobs:
  shipped-change:
    # workflow_run has no paths filter, so classify the exact commit that CI
    # tested before calling the fleet-wide release workflow. Keep this a
    # positive allowlist: new repository metadata stays release-neutral until
    # it is deliberately identified as an input to a shipped artifact.
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    outputs:
      shipped: ${{ steps.paths.outputs.shipped }}
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout the commit CI tested
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Classify changed paths
        id: paths
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          changed_paths="${RUNNER_TEMP}/auto-rc-changed-paths"
          if git cat-file -e "${HEAD_SHA}^" 2>/dev/null; then
            # --no-renames preserves both sides of a move. Moving a shipped
            # source path out of the allowlist must still cut an RC.
            git diff --name-only --no-renames -z "${HEAD_SHA}^" "${HEAD_SHA}" > "${changed_paths}"
          else
            # A root commit has no parent. Treat every path it introduces as
            # changed; this is also the fail-safe if the parent is unavailable.
            git ls-tree --name-only -r -z "${HEAD_SHA}" > "${changed_paths}"
          fi

          shipped=false
          while IFS= read -r -d '' path; do
            case "${path}" in
              *.go | go.mod | go.sum | vendor/* | grafana/* | charts/* | deploy/* | \
                justfile | Dockerfile | .dockerignore | .goreleaser.yml | LICENSE | \
                internal/webui/oui_data.txt | internal/webui/templates/* | \
                scripts/notices.sh | scripts/notices.tsv.tmpl | \
                .github/workflows/auto-rc.yml | .github/workflows/publish.yml | \
                .github/workflows/release-please.yml)
                shipped=true
                echo "Shipped-artifact input changed: ${path}"
                break
                ;;
            esac
          done < "${changed_paths}"

          echo "shipped=${shipped}" >> "${GITHUB_OUTPUT}"

  rc:
    # shipped-change itself runs only after green CI; this second gate prevents
    # release-neutral commits from reaching the shared RC workflow.
    needs: shipped-change
    if: needs.shipped-change.outputs.shipped == 'true'
    permissions:
      contents: write      # create the RC tag and the GitHub prerelease
      pull-requests: read  # find the open release-please PR
      checks: read         # poll ci-success for this commit
    uses: rknightion/.github/.github/workflows/auto-rc.yml@7be903bd193f76b1a590cbe54943a9bf9592ce45 # v1.18.0
    with:
      # Under workflow_run, github.sha is the DEFAULT BRANCH HEAD, not the
      # commit CI ran on — it races ahead on rapid pushes. head_sha is the
      # commit the triggering run actually tested.
      sha: ${{ github.event.workflow_run.head_sha }}
      image-ref: ghcr.io/rknightion/opnsense2otel

  # Same image + chart path a stable release takes, just with an RC tag.
  # container-publish suppresses `latest` for any tag containing '-', so an RC
  # can never steal Latest from a stable release.
  publish:
    needs: rc
    if: needs.rc.outputs.tag != ''
    permissions:
      contents: write        # attach SBOMs + notices to the RC release
      packages: write        # push the image and chart to GHCR
      id-token: write        # cosign keyless signing
      attestations: write    # SLSA build provenance
      security-events: write # Trivy SARIF upload
    uses: ./.github/workflows/publish.yml
    with:
      release_tag: ${{ needs.rc.outputs.tag }}

  # goreleaser-args and pre-cmd are copied VERBATIM from release-please.yml's
  # binaries job (tag reference adapted to this workflow's `rc` job output).
  binaries:
    needs: rc
    if: needs.rc.outputs.tag != ''
    permissions:
      contents: write     # upload binaries + checksums to the RC release
      id-token: write     # cosign keyless signing
      packages: write     # goreleaser reads the registry for existing artifacts
      attestations: write # SLSA build provenance on the archives
    uses: rknightion/.github/.github/workflows/binaries.yml@7be903bd193f76b1a590cbe54943a9bf9592ce45 # v1.18.0
    with:
      release-tag: ${{ needs.rc.outputs.tag }}
      go-version: "1.27.0"
      install-cosign: true
      pre-cmd: "go install github.com/anchore/syft/cmd/syft@v1.51.1" # archive SBOMs
