name: Release Please

on:
  push:
    branches: [main]

# Default to read-only; each job requests only the write scopes it needs.
permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      major: ${{ steps.release.outputs.major }}
      minor: ${{ steps.release.outputs.minor }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          # PAT (not GITHUB_TOKEN): a non-default-token author lets the release PR's CI
          # run without manual approval. Fall back to github.token if the PAT is
          # unset/expired/revoked so this job still succeeds — otherwise its failure
          # would skip the needs:release-please downstream jobs (binaries/publish/edge),
          # silently halting :main edge image publishing on every push (#131). The
          # tradeoff on the fallback path: the release PR is then bot-authored, so its
          # reusable-workflow CI checks may need a manual "Approve and run".
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}

  # Binaries via the shared GoReleaser reusable (cross-compiled binaries + checksums,
  # uploaded to the release-please release). The image is published by the publish job.
  binaries:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: write # upload release assets
      id-token: write
      packages: write
    uses: rknightion/.github/.github/workflows/binaries.yml@f31690684f4292d1fe8e528618f7c8306fe27d9a # v1.3.1
    with:
      release-tag: ${{ needs.release-please.outputs.tag_name }}
      go-version: "1.26"
      install-cosign: true # keyless-sign the checksums (see .goreleaser.yml signs:)
      pre-cmd: "go install github.com/anchore/syft/cmd/syft@v1.46.0" # archive SBOMs

  # Build, sign, attest, and publish the container image; attach third-party notices + SBOMs.
  # Delegates image work to the shared reusable; the notices job runs make notices sbom locally.
  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
      security-events: write
    uses: ./.github/workflows/publish.yml
    with:
      release_tag: ${{ needs.release-please.outputs.tag_name }}

  # Edge build on every non-release push to main: publishes the :main multi-arch image
  # (replaces the removed docker-build-main job). release_created gates this vs the
  # release publish above, so the two never both run on one push.
  edge:
    needs: release-please
    if: needs.release-please.outputs.release_created != 'true'
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
      security-events: write
    uses: ./.github/workflows/publish.yml
    with:
      release_tag: ""
