name: Release Please

on:
  push:
    branches: [main]

# Default to read-only; each job requests only the write scopes it needs.
permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      id-token: write # exchanged for a tailnet identity and an OpenBao token
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      major: ${{ steps.release.outputs.major }}
      minor: ${{ steps.release.outputs.minor }}
    steps:
      # Mints a short-lived GitHub App installation token scoped to THIS repo,
      # replacing RELEASE_PLEASE_TOKEN -- a PAT scoped across every rknightion repo.
      # Nothing durable is stored here to leak. The release PR's author becomes the
      # App rather than rknightion; CI still runs unattended on it, because the
      # action_required gate applies to github-actions[bot], not to bot identities
      # generally -- Renovate, a GitHub App, already runs fine.
      #
      # Releases now depend on camden being up, unsealed and on the tailnet; a
      # failure here is infrastructure, not the commit.
      - name: Mint a scoped release token
        id: bao
        uses: rknightion/.github/.github/actions/broker-token@bc58399e49a8d8131a379f530fffe8c9659667f9
        with:
          permission-set: release-please-opnsense2otel
          tailscale-client-id: ${{ secrets.TS_WIF_CLIENT_ID }}
          tailscale-audience: ${{ secrets.TS_WIF_AUDIENCE }}

      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          token: ${{ steps.bao.outputs.token }}

  # Binaries via the shared GoReleaser reusable (cross-compiled binaries + checksums,
  # uploaded to the release-please release). The image is published by the publish job.
  binaries:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: write # upload release assets
      id-token: write
      packages: write
      attestations: write # SLSA build provenance (.intoto.jsonl) attached to the release
    uses: rknightion/.github/.github/workflows/binaries.yml@d1c590b295b9d7f2535fadc7bc5e74f2eddbd512 # main
    with:
      release-tag: ${{ needs.release-please.outputs.tag_name }}
      go-version: "1.27.0"
      install-cosign: true # keyless-sign the checksums (see .goreleaser.yml signs:)
      pre-cmd: "go install github.com/anchore/syft/cmd/syft@v1.51.0" # archive SBOMs

  # Build, sign, attest, and publish the container image; attach third-party notices + SBOMs.
  # Delegates image work to the shared reusable; the notices job runs make notices sbom locally.
  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
      security-events: write
    uses: ./.github/workflows/publish.yml
    with:
      release_tag: ${{ needs.release-please.outputs.tag_name }}

  # A publish job can partially succeed: v3.0.0 proved that the image and binaries
  # may land while notices fail. Read the release back after both publishing arms
  # and fail on any missing mandatory artifact (#436).
  verify-release-assets:
    needs: [release-please, binaries, publish]
    if: always() && needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Verify mandatory release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          mapfile -t actual < <(
            gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --json assets --jq '.assets[].name'
          )
          required=(
            THIRD_PARTY_NOTICES.md
            checksums.txt
            checksums.txt.intoto.jsonl
            checksums.txt.sigstore.json
            opnsense2otel.cdx.json
            opnsense2otel.spdx.json
            opnsense2otel_Darwin_arm64.tar.gz
            opnsense2otel_Darwin_arm64.tar.gz.sbom.json
            opnsense2otel_Darwin_x86_64.tar.gz
            opnsense2otel_Darwin_x86_64.tar.gz.sbom.json
            opnsense2otel_Freebsd_arm64.tar.gz
            opnsense2otel_Freebsd_arm64.tar.gz.sbom.json
            opnsense2otel_Freebsd_x86_64.tar.gz
            opnsense2otel_Freebsd_x86_64.tar.gz.sbom.json
            opnsense2otel_Linux_arm64.tar.gz
            opnsense2otel_Linux_arm64.tar.gz.sbom.json
            opnsense2otel_Linux_x86_64.tar.gz
            opnsense2otel_Linux_x86_64.tar.gz.sbom.json
            opnsense2otel_Openbsd_arm64.tar.gz
            opnsense2otel_Openbsd_arm64.tar.gz.sbom.json
            opnsense2otel_Openbsd_x86_64.tar.gz
            opnsense2otel_Openbsd_x86_64.tar.gz.sbom.json
            opnsense2otel_Windows_x86_64.zip
            opnsense2otel_Windows_x86_64.zip.sbom.json
          )
          required+=("opnsense2otel-${{ needs.release-please.outputs.version }}.tgz")
          missing=()
          for asset in "${required[@]}"; do
            if ! printf '%s\n' "${actual[@]}" | grep -Fqx "$asset"; then
              missing+=("$asset")
            fi
          done
          if ((${#missing[@]})); then
            printf '::error::release %s is missing mandatory asset: %s\n' \
              "$RELEASE_TAG" "${missing[@]}"
            exit 1
          fi
          printf 'verified %d mandatory assets on %s\n' "${#required[@]}" "$RELEASE_TAG"

  # Edge build on every non-release push to main: publishes the :main multi-arch image
  # (replaces the removed docker-build-main job). release_created gates this vs the
  # release publish above, so the two never both run on one push.
  edge:
    needs: release-please
    if: needs.release-please.outputs.release_created != 'true'
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
      security-events: write
    uses: ./.github/workflows/publish.yml
    with:
      release_tag: ""
