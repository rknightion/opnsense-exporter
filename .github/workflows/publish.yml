name: publish
on:
  workflow_call:
    inputs:
      release_tag: { required: false, type: string, default: "" }
  workflow_dispatch:
    inputs:
      release_tag: { description: "vX.Y.Z; empty = edge :main test", required: false, type: string, default: "" }
permissions:
  contents: read
jobs:
  # Resolves the pinned go-licenses version/module out of the justfile (the one source
  # of truth, #436) so the release image build below installs the SAME tool the
  # `notices` job (and ci.yml's docker-build) use — the Dockerfile has no
  # default of its own to silently diverge from that pin.
  go-licenses-pin:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.pin.outputs.version }}
      module: ${{ steps.pin.outputs.module }}
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          persist-credentials: false
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: '1.58.0'
      - name: Resolve pinned go-licenses version + module
        id: pin
        run: |
          echo "version=$(just print-go-licenses-version)" >> "$GITHUB_OUTPUT"
          echo "module=$(just print-go-licenses-module)" >> "$GITHUB_OUTPUT"
  image:
    needs: go-licenses-pin
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
      security-events: write
    uses: rknightion/.github/.github/workflows/container-publish.yml@0e56520d848f5fda8cbfa0bda17797ef41f2a5a7 # v1.9.8 # zizmor: ignore[unpinned-uses]
    with:
      release-tag: ${{ inputs.release_tag }}
      build-args: |
        GO_LICENSES_VERSION=${{ needs.go-licenses-pin.outputs.version }}
        GO_LICENSES_MODULE=${{ needs.go-licenses-pin.outputs.module }}
      # Publish charts only for real releases. The pinned shared reusable gives
      # edge charts a 12-character appVersion while its edge image SHA tag is
      # seven characters, so an edge chart would point at a nonexistent image.
      # Release packages override both chart/app versions to the same semver.
      helm-chart-path: ${{ inputs.release_tag != '' && 'charts/opnsense2otel' || '' }}
  notices:
    if: inputs.release_tag != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag }}
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: '1.58.0'
      # Only go-licenses notices here; the shared reusable already generates +
      # attaches the image SPDX+CycloneDX SBOMs (same filenames — don't double-upload).
      - name: Generate + attach third-party notices
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          just notices
          gh release upload "${RELEASE_TAG}" THIRD_PARTY_NOTICES.md --clobber
