name: OPNsense Live-Box Canary

# The live half of the API drift detection (#195): joins the tailnet, probes
# every endpoint on the development-channel OPNsense box, validates the payload
# STRUCTURE against schemas derived from our response structs (cmd/apidrift),
# then runs the actual exporter end-to-end and asserts collector success plus a
# metric-name floor. Drift lands in the same api-drift issue machinery as the
# endpoint-manifest canary (api-contract.yml), under its own issue title.
#
# Runs once per probe target (nightly = devel-channel box, release-vm =
# release-channel box), each filing into its OWN issue so neither can close the
# other's findings. camden runs the third target, prod, on a systemd timer.
#
# Reports and logs carry key paths + JSON type names only — never payload
# values (the box's data must not leak into a public repo).

# DISPATCH ONLY — the daily trigger lives on `oli`, not here.
#
# This used to carry `cron: '47 6 * * *'`, sized against the 06:00-08:30 UTC
# testbed power window #625 introduced. GitHub does not run scheduled workflows
# at the requested time: every scheduled run from 2026-08-02 to 2026-08-05 started
# between 08:55 and 10:26 UTC — 2h08 to 3h39 late — so the runner dialled boxes
# that were already shut down and the canary failed four days running with
# `pre-flight probe failed - box unreachable`. Scheduled runs are documented as
# best-effort with no upper bound on the delay, so there is no cron time that fixes
# it and no window width short of most of the day, which is the cost #625 exists to
# avoid.
#
# `oli` raises the lab and knows the exact moment both firewalls serve :443, so it
# now POSTs the dispatch itself (scripts/testbed/opnsense-testbed-canary-dispatch.sh
# + opnsense-testbed-canary.timer) and holds the lab up until the run finishes. Do
# NOT add a `schedule:` back as a second trigger — a delayed copy would fire against
# a lab that is already down, or race the real run, and report either as drift.
on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: live-canary
  cancel-in-progress: false

env:
  # Distinct floors so a partial outage is distinguishable from drift:
  # every enabled sub-collector must succeed (the smoke waits for /-/ready, i.e.
  # for the poll scheduler to have polled all of them once); the box emits 622
  # catalogue metric names on the last recorded clean run and 641 on a warm local
  # run against it (2026-07-21) — the count grew with the collectors added since the
  # 495-name figure this floor was first written against. Floor keeps ~10% of
  # headroom for box-state variance (a plugin off, an empty lease table).
  METRIC_NAME_FLOOR: '560'

jobs:
  canary:
    # One job per probe target. Each owns its OWN drift issue (title suffixed
    # with the target) rather than sharing one, because the close-on-clean step
    # below cannot tell whose findings an issue holds: with a shared issue, a
    # clean run on one box closes an issue holding another box's real drift and
    # comments "clean" over it. Separate titles make that structurally
    # impossible instead of guarded against.
    strategy:
      # Never cancel the sibling target because one box is down or drifting -
      # the whole point is reading the two generations against each other.
      fail-fast: false
      matrix:
        include:
          - target: nightly
            host_secret: DEVBOX_HOST
            key_secret: DEVBOX_API_KEY
            secret_secret: DEVBOX_API_SECRET
          - target: release-vm
            host_secret: DEVBOX2_HOST
            key_secret: DEVBOX2_API_KEY
            secret_secret: DEVBOX2_API_SECRET
    # Hardening, since this workflow holds tailnet credentials in a public
    # repo: it triggers only on schedule + manual dispatch (never on
    # pull_request, so fork PRs can neither run it nor see its secrets), the
    # secrets live in the `tailnet` environment whose deployment-branch policy
    # is main-only, and the repository guard stops forks' copies from even
    # attempting scheduled runs. timeout-minutes bounds how long the ephemeral
    # node can exist if something hangs.
    if: github.repository == 'rknightion/opnsense2otel'
    name: canary (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: tailnet
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Join tailnet
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          # The tailnet overrides DNS to a private resolver tag:ci cannot reach,
          # which kills api.github.com resolution after the join. The box is
          # dialled by raw tailnet IP, so MagicDNS is not needed here.
          args: --accept-dns=false

      - name: Schema canary (apidrift)
        id: drift
        env:
          DEVBOX_HOST: ${{ secrets[matrix.host_secret] }}
          OPN2OTEL_OPS_API_KEY: ${{ secrets[matrix.key_secret] }}
          OPN2OTEL_OPS_API_SECRET: ${{ secrets[matrix.secret_secret] }}
          CANARY_PROFILE: ${{ matrix.target }}
        run: |
          set -euo pipefail
          mkdir -p out
          # Exit 0 = clean or warnings-only; exit 1 = breaking drift (outputs
          # are written first); anything else = probe error.
          if go run ./cmd/apidrift --base-url "https://${DEVBOX_HOST}" --insecure \
               --profile "${CANARY_PROFILE}" \
               --out out/report.md --captures "$RUNNER_TEMP/captures"; then
            :
          else
            code=$?
            if [ "$code" -ne 1 ]; then
              echo "apidrift failed with code $code" >&2
              exit "$code"
            fi
          fi
          cat out/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: End-to-end exporter smoke
        id: smoke
        env:
          DEVBOX_HOST: ${{ secrets[matrix.host_secret] }}
          OPN2OTEL_OPS_API_KEY: ${{ secrets[matrix.key_secret] }}
          OPN2OTEL_OPS_API_SECRET: ${{ secrets[matrix.secret_secret] }}
          OPN2OTEL_OPS_PROTOCOL: https
          OPN2OTEL_OPS_INSECURE: 'true'
          OPN2OTEL_INSTANCE_LABEL: canary
        run: |
          set -euo pipefail
          go build -o /tmp/opnsense2otel .
          OPN2OTEL_OPS_API="$DEVBOX_HOST" /tmp/opnsense2otel \
            --exporter.enable-arp-details \
            --exporter.enable-ndp-details \
            --exporter.enable-unbound-infra \
            --exporter.enable-openvpn-details \
            --exporter.enable-firmware-package-details \
            --exporter.enable-dnsmasq-details \
            --exporter.enable-firewall-rules-details \
            --exporter.enable-kea-details \
            --exporter.enable-network-diagnostics \
            --exporter.enable-netflow \
            --exporter.enable-dhcpv4-details \
            --exporter.enable-dhcpv6-details \
            --exporter.enable-smart \
            --exporter.enable-tailscale-peer-details \
            --exporter.enable-alias-details \
            --exporter.enable-hasync &
          EXPORTER_PID=$!
          trap 'kill "$EXPORTER_PID" 2>/dev/null || true' EXIT

          # Wait for the poll scheduler to warm up (#341). Since #336 a scrape
          # replays the snapshot the per-collector pollers fill, so scraping a
          # few seconds after start reports only the handful of collectors that
          # have polled so far — which is what made this smoke read 24 of 47
          # collectors and 170 of ~495 metric names. /-/ready turns 200 only once
          # the health poll AND every collector have completed a first poll, so it
          # is the correct gate; readiness results are cached for 10s, hence the
          # 5s poll and the generous ceiling.
          ready=0
          for _ in $(seq 1 60); do
            if curl -sf -m 10 -o /dev/null http://localhost:8080/-/ready; then
              ready=1
              break
            fi
            sleep 5
          done
          # Serving is a pure memory read now, so the scrape itself is fast; the
          # retries only cover the (already-ready) listener being momentarily busy.
          curl -sf -m 60 --retry 5 --retry-delay 5 --retry-connrefused \
            -o /tmp/metrics.txt http://localhost:8080/metrics

          fail=0
          # shellcheck disable=SC2016 # single-quoted $1/$2 are awk field refs, not shell vars
          {
            echo ""
            echo "## End-to-end exporter smoke"
            echo ""
            if [ "$ready" = 1 ]; then
              echo "- exporter reached \`/-/ready\` (poll scheduler warm) ✅"
            else
              echo "- exporter never reached \`/-/ready\` within 300s — the assertions below ran against a partial snapshot ❌"
              fail=1
            fi
            up=$(awk '$1 ~ /^opnsense_up\{/ { print $2 }' /tmp/metrics.txt | head -n1)
            if [ "$up" = "1" ]; then
              echo "- \`opnsense_up\` = 1 ✅"
            else
              echo "- \`opnsense_up\` = ${up:-absent} ❌"
              fail=1
            fi
            failed_collectors=$(awk '$1 ~ /^opnsense_exporter_scrape_collector_success\{/ && $2 == 0 { print $1 }' /tmp/metrics.txt || true)
            ok_collectors=$(awk '$1 ~ /^opnsense_exporter_scrape_collector_success\{/ && $2 == 1 { c++ } END { print c+0 }' /tmp/metrics.txt)
            if [ -z "$failed_collectors" ] && [ "$ok_collectors" -gt 0 ]; then
              echo "- all ${ok_collectors} sub-collectors succeeded ✅"
            else
              echo "- failed sub-collectors ❌:"
              # Label sets only — no payload values.
              echo "$failed_collectors" | sed 's/^/  - `/; s/$/`/'
              fail=1
            fi
            names=$(grep -c '^# TYPE opnsense_' /tmp/metrics.txt || true)
            if [ "$names" -ge "$METRIC_NAME_FLOOR" ]; then
              echo "- ${names} distinct \`opnsense_*\` metric names (floor ${METRIC_NAME_FLOOR}) ✅"
            else
              echo "- only ${names} distinct \`opnsense_*\` metric names (floor ${METRIC_NAME_FLOOR}) ❌"
              fail=1
            fi
          } >> out/report.md
          cat out/report.md >> "$GITHUB_STEP_SUMMARY"
          echo "failed=$fail" >> "$GITHUB_OUTPUT"
          # Job failure is decided after the issue steps, so a smoke failure
          # still files/updates the drift issue first.

      - name: Ensure api-drift label exists
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create api-drift --color B60205 \
            --description "OPNsense API contract drift detected by CI" 2>/dev/null || true

      - name: Open or update drift issue
        if: steps.drift.outputs.drift == 'true' || steps.drift.outputs.warnings == 'true' || steps.smoke.outputs.failed == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          CANARY_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          # ONE ISSUE PER TARGET. The close step below has no way to tell which
          # target's findings an issue holds, so a shared issue means a clean run
          # on one box closes another box's live drift and comments "clean" over
          # it — a canary reporting all-clear while real drift sits unread.
          # camden's prod canary uses the same "- prod" suffix convention.
          title="OPNsense live-box canary drift - ${CANARY_TARGET}"
          # Label+exact-title dedupe — same proven pattern as api-contract.yml
          # (author-based matching broke on gh's bot-login shape changes, #83).
          existing=$(gh issue list --label api-drift --state open --json number,title \
            --jq ".[] | select(.title == \"$title\") | .number" \
            | head -n1)
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file out/report.md
          else
            gh issue create --title "$title" --label api-drift --body-file out/report.md
          fi

      - name: Close drift issue when clean
        # Any clean run closes the issue — scheduled or manually dispatched;
        # both exercise the identical validation against the same box.
        if: steps.drift.outputs.drift == 'false' && steps.drift.outputs.warnings == 'false' && steps.smoke.outputs.failed == '0'
        env:
          GH_TOKEN: ${{ github.token }}
          CANARY_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          # Only ever closes THIS target's issue. A sibling target's drift is a
          # different issue and is none of this job's business.
          title="OPNsense live-box canary drift - ${CANARY_TARGET}"
          existing=$(gh issue list --label api-drift --state open --json number,title \
            --jq ".[] | select(.title == \"$title\") | .number" \
            | head -n1)
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Live-box canary clean on the latest ${CANARY_TARGET} run. Closing."
            gh issue close "$existing"
          fi

      - name: Fail the job on drift or smoke failure
        if: steps.drift.outputs.drift == 'true' || steps.smoke.outputs.failed == '1'
        run: |
          echo "Live-box drift or smoke failure (see the run summary / the api-drift issue)." >&2
          exit 1
