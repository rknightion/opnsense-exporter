name: CI


on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  repo-meta:
    uses: ./.github/workflows/repo-meta.yml

  tests:
    name: Tests & Linters
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.0"

      - name: Run linters
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # Pin the golangci-lint binary (not `latest`) so lint results are reproducible
          # across runs of the same commit and a new release can't fail CI with no repo
          # change (#132). Renovate bumps this via the annotation below.
          # renovate: datasource=github-releases depName=golangci/golangci-lint
          version: v2.13.1
          args: --verbose

      - name: Run tests
        run: go test -v ./...

      - name: Check for un-allowlisted globally routable IP literals (#565)
        run: make check-public-ips

  # Dedicated race-detector gate. Runs the FULL suite under -race across every package,
  # with no command-line -skip exception (#295): the one assertion that cannot survive
  # race instrumentation — TestEnrichMessageAllocations — is excluded via a `//go:build
  # !race` constraint in the code itself, so this job needs no per-test carve-out and any
  # new test is race-covered by default. Split from `tests` so a data-race failure is a
  # distinct, unambiguous signal (not tangled with lint) — and, via `ci-success` below,
  # a blocking one. setup-go@v7 caches the build/module cache keyed on go.sum by default.
  race:
    name: Race detector
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.0"

      - name: Run tests with the race detector
        run: go test -race -timeout 15m ./...

  fuzz-smoke:
    name: Fuzz smoke (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: netflow
            package: ./internal/flow/netflow
            target: FuzzDecodePacketAndTemplate
          - name: syslog-envelope
            package: ./internal/logship/syslog
            target: FuzzParseEnvelope
          - name: syslog-tcp
            package: ./internal/logship/syslog
            target: FuzzTCPFrames
          - name: zenarmor
            package: ./internal/logship/zenarmor
            target: FuzzParseDocument
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.0"

      # This is a deterministic blocking smoke gate. Longer corpus-retaining runs
      # live in fuzz.yml so normal CI neither restores nor publishes mutable corpus.
      #
      # `-timeout` is NOT the fuzz duration (#469): it bounds the whole test binary,
      # including compilation and baseline-corpus coverage gathering, both of which
      # grow as the parser surface does. At 45s a cold-cache build left under 8s of
      # the budget and the job failed with "context deadline exceeded" and no
      # crashing input — a red REQUIRED check for a reason unrelated to the commit,
      # which teaches everyone to re-run red CI without reading it. `-fuzztime` stays
      # at 10s; only the ceiling moved.
      - name: Run bounded fuzz target
        env:
          FUZZ_PACKAGE: ${{ matrix.package }}
          FUZZ_TARGET: ${{ matrix.target }}
        run: >-
          go test "$FUZZ_PACKAGE"
          -run='^$'
          -fuzz="^${FUZZ_TARGET}$"
          -fuzztime=10s
          -parallel=1
          # 3m, not 5m: the job's own timeout-minutes is 5, and go test's timeout must
          # fire FIRST so the log says which target hung instead of the runner killing
          # the step with no attribution.
          -timeout=3m

  docs:
    name: Generated docs up-to-date
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.0"

      - name: Verify generated docs match code (docgen + doclint + registry gate)
        run: make docs-check

  deployment-contracts:
    name: Executable deployment contracts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.0"

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      # Validates the exact documented Compose block, the systemd credential
      # permission model, canonical Kubernetes manifests, and Helm renders.
      - name: Run deployment contract tests
        run: make deployment-test

      # Checks for the testbed config linter (#504). It reads a firewall's config.xml,
      # which CI cannot reach, so only its unit tests run here.
      - name: Run testbed tooling tests
        run: make testbed-test

      # Checks for camden's prod canary decision logic (#612). The script needs the
      # production firewall, an admin credential and a GitHub token, so only its
      # open-vs-closed decision is exercised here, via its --decide-only seam.
      - name: Run prod canary tooling tests
        run: make canary-test

  grafana:
    name: Grafana artifacts up-to-date
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.0"
          cache-dependency-path: tools/promqlcheck/go.sum

      # The builders' own unit tests, run first and named separately so a failure
      # here is not read as a staleness failure. Wired into CI 2026-07-25: they had
      # never run anywhere, and three of sixteen had rotted into failure unnoticed.
      - name: Run the grafana builder unit tests
        run: make grafana-test

      # Coverage gate (every catalogue metric on the dashboard) + regeneration
      # staleness (dashboard.json / dashboard-stats.json / grafana-managed manifests)
      # + manifest validity. Pure-stdlib Python, no deps to install (#84).
      - name: Verify dashboard coverage, regeneration freshness and manifest validity
        run: make grafana-check

  docker-build-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # NOTE: no OTEL build-telemetry driver-opts here — the OTEL_EXPORTER_OTLP_ENDPOINT
      # / _HEADERS repo secrets it referenced were never provisioned, so it set
      # OTEL_TRACES_EXPORTER=otlp with no destination and emitted doomed exports every
      # push build. Removed as dead config (#133); re-add conditionally (guarded on the
      # endpoint secret being present) if build tracing is ever wired up.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # Resolves the SAME go-licenses version/module the Makefile pins (#436), so this
      # job's docker build exercises the real release-tooling install on every push/PR
      # from a clean Docker layer (no reused .tools/ binary can mask a broken pin) —
      # this is the CI smoke step for the v2.0.1 "post-v2 module path" regression class.
      - name: "Resolve pinned go-licenses version + module (single source: Makefile, #436)"
        id: go-licenses-pin
        run: |
          echo "version=$(make -s print-go-licenses-version)" >> "$GITHUB_OUTPUT"
          echo "module=$(make -s print-go-licenses-module)" >> "$GITHUB_OUTPUT"

      - name: Build Docker image (verify only)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          load: true
          tags: opnsense2otel:ci-test
          # VERSION (all-caps) MUST match the build-arg name the real publish
          # pipeline supplies (rknightion/.github container-publish passes
          # VERSION=...). Docker build-arg names are case-sensitive, so a
          # mismatch here would silently ship images with an empty version (#79).
          # GO_LICENSES_VERSION/GO_LICENSES_MODULE have no Dockerfile default (#436) —
          # omitting them here would fail this build on the `test -n` guard, which is
          # the point: it proves the pin the release build will use actually installs.
          build-args: |
            VERSION=ci-test
            GO_LICENSES_VERSION=${{ steps.go-licenses-pin.outputs.version }}
            GO_LICENSES_MODULE=${{ steps.go-licenses-pin.outputs.module }}
          cache-from: |
            type=gha,scope=build-verify
            type=gha,scope=build-linux-amd64
          cache-to: type=gha,scope=build-verify,mode=max

      - name: Verify built image embeds the version
        run: |
          got="$(docker run --rm opnsense2otel:ci-test --version 2>&1 | head -n1)"
          echo "image reported version: '${got}'"
          if [ "${got}" != "ci-test" ]; then
            echo "::error::image did not embed the build-arg VERSION (got '${got}', want 'ci-test') — Dockerfile ARG casing regression, see #79"
            exit 1
          fi

      # #549: the image bundles DB-IP Lite Country + ASN at the paths that are the
      # defaults of --geoip.country-database / --geoip.asn-database. The Dockerfile
      # already fails its own build on a short or mistyped download, so what this
      # adds is the seam the Dockerfile cannot check: that the files landed at the
      # exact paths internal/geoip/bundled.go names, and that the CC BY 4.0 credit
      # shipped beside them. Getting the path wrong is silent — enrichment just
      # never answers, which looks identical to a quiet network.
      - name: Verify the image bundles the DB-IP databases and their attribution
        run: |
          set -euo pipefail
          cid="$(docker create opnsense2otel:ci-test)"
          trap 'docker rm -f "$cid" >/dev/null' EXIT
          out="$(mktemp -d)"
          for f in /usr/share/opnsense2otel/geoip/dbip-country-lite.mmdb \
                   /usr/share/opnsense2otel/geoip/dbip-asn-lite.mmdb \
                   /licenses/GEOIP-DB-IP-ATTRIBUTION.txt; do
            docker cp "$cid:$f" "$out/" || {
              echo "::error::image is missing $f (#549)"; exit 1; }
          done
          for db in dbip-country-lite.mmdb dbip-asn-lite.mmdb; do
            sz="$(wc -c < "$out/$db")"
            echo "$db: $sz bytes"
            [ "$sz" -ge 4000000 ] || { echo "::error::$db is only $sz B"; exit 1; }
          done
          grep -q 'db-ip.com' "$out/GEOIP-DB-IP-ATTRIBUTION.txt" || {
            echo "::error::the bundled attribution does not credit DB-IP with a link — this is the CC BY 4.0 condition"; exit 1; }

      # Exercise the same plain-Compose seams published in docs/deployment/docker.md
      # (#438): file-backed secrets readable by the distroless image's non-root user,
      # exec-form native health probe, and the /-/healthy endpoint. The OPNsense
      # address is deliberately unreachable; liveness must not depend on a poll.
      - name: Verify documented Compose secrets and healthcheck
        run: |
          compose_dir="$(mktemp -d)"
          trap 'docker compose -f "$compose_dir/compose.yaml" down --volumes --remove-orphans; rm -rf "$compose_dir"' EXIT
          mkdir -p "$compose_dir/secrets"
          printf '%s' 'ci-api-key' > "$compose_dir/secrets/api-key"
          printf '%s' 'ci-api-secret' > "$compose_dir/secrets/api-secret"
          chmod 400 "$compose_dir/secrets/api-key" "$compose_dir/secrets/api-secret"
          sudo chown 65532:65532 "$compose_dir/secrets/api-key" "$compose_dir/secrets/api-secret"

          tee "$compose_dir/compose.yaml" >/dev/null <<'YAML'
          services:
            opnsense2otel:
              image: opnsense2otel:ci-test
              command:
                - --opnsense.protocol=https
                - --opnsense.address=127.0.0.1
                - --web.listen-address=:8080
              environment:
                OPS_API_KEY_FILE: /run/secrets/opnsense-api-key
                OPS_API_SECRET_FILE: /run/secrets/opnsense-api-secret
              secrets:
                - opnsense-api-key
                - opnsense-api-secret
              healthcheck:
                test: ["CMD", "/opnsense2otel", "health"]
                interval: 1s
                timeout: 2s
                retries: 10
                start_period: 1s
          secrets:
            opnsense-api-key:
              file: ./secrets/api-key
            opnsense-api-secret:
              file: ./secrets/api-secret
          YAML

          docker compose -f "$compose_dir/compose.yaml" config --quiet
          docker compose -f "$compose_dir/compose.yaml" run --rm --no-deps \
            opnsense2otel --opnsense.protocol=https --opnsense.address=127.0.0.1 --config.check
          docker compose -f "$compose_dir/compose.yaml" up -d --wait --wait-timeout 30

          container_id="$(docker compose -f "$compose_dir/compose.yaml" ps -q opnsense2otel)"
          status="$(docker inspect --format '{{.State.Health.Status}}' "$container_id")"
          if [ "$status" != "healthy" ]; then
            docker compose -f "$compose_dir/compose.yaml" logs
            echo "::error::documented native healthcheck reported '$status', want 'healthy'"
            exit 1
          fi

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.0"

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Install kind
        run: go install sigs.k8s.io/kind@v0.32.0

      - name: Install and upgrade the chart in a disposable cluster
        run: |
          kind create cluster --name chart-contract --wait 60s
          kind load docker-image opnsense2otel:ci-test --name chart-contract
          kubectl create namespace monitoring
          kubectl -n monitoring create secret generic edge-fw-api \
            --from-literal=key=ci-api-key \
            --from-literal=secret=ci-api-secret

          helm upgrade --install contract charts/opnsense2otel \
            --namespace monitoring \
            --values charts/opnsense2otel/tests/fixtures/minimal.yaml \
            --set image.repository=opnsense2otel \
            --set image.tag=ci-test \
            --set image.pullPolicy=Never \
            --wait --timeout 2m
          kubectl -n monitoring rollout status deployment/contract-opnsense2otel --timeout=60s
          helm test contract --namespace monitoring --logs --timeout 60s

          helm upgrade contract charts/opnsense2otel \
            --namespace monitoring \
            --values charts/opnsense2otel/tests/fixtures/all-receivers.yaml \
            --set opnsense.existingSecret=edge-fw-api \
            --set image.repository=opnsense2otel \
            --set image.tag=ci-test \
            --set image.pullPolicy=Never \
            --wait --timeout 2m
          kubectl -n monitoring rollout status deployment/contract-opnsense2otel --timeout=60s

      - name: Delete disposable chart cluster
        if: always()
        run: kind delete cluster --name chart-contract

  # Test coverage -> Codacy. Deliberately NOT in ci-success's `needs`: coverage reporting is
  # informational, so a Codacy outage — or a fork PR with no secret — must never block merges or
  # Renovate automerge. Generates an atomic coverage profile and uploads via the pinned official
  # reporter action (no curl|bash, which zizmor flags). The action derives provider/owner/repo from
  # the GitHub context, so the account token is the only Codacy input needed.
  coverage:
    name: Coverage to Codacy
    runs-on: ubuntu-24.04
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    env:
      CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.0"

      - name: Generate coverage profile
        run: make coverage

      - name: Upload coverage to Codacy
        if: ${{ env.CODACY_PROJECT_TOKEN != '' }}   # skip on fork PRs (secret unavailable)
        uses: codacy/codacy-coverage-reporter-action@89d6c85cfafaec52c72b6c5e8b2878d33104c699 # v1.3.0
        with:
          project-token: ${{ env.CODACY_PROJECT_TOKEN }}
          coverage-reports: coverage.out
          force-coverage-parser: go

  # Single required status check. Branch protection on `main` requires ONLY this job, so the gate's
  # jobs (tests / docs / docker build-verify) can be added or renamed without re-touching protection.
  # It fails if any required job failed or was cancelled; the main-only publish jobs aren't depended on
  # here, so a PR (where they're skipped) still passes. Renovate's automerge waits for this to go green.
  # NOTE: `coverage` is intentionally absent from `needs` — see its comment above.
  ci-success:
    name: ci-success
    runs-on: ubuntu-24.04
    if: always()
    needs: [repo-meta, tests, race, fuzz-smoke, docs, deployment-contracts, grafana, docker-build-verify]
    steps:
      - name: Fail if any required job did not pass
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "A required job failed or was cancelled: ${{ join(needs.*.result, ', ') }}"
          exit 1
      - name: All required jobs passed
        run: echo "ci-success — ${{ join(needs.*.result, ', ') }}"
