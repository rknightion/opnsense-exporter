[project]
site_name = "opnsense2otel"
site_description = "Prometheus and OpenTelemetry exporter for OPNsense firewalls: 1001 metrics across 65 collectors, native OTLP metrics and logs, a syslog receiver, and NetFlow and Zenarmor flow shipping"
site_url = "https://m7kni.io/opnsense2otel/"
site_author = "Rob Knighton"
repo_name = "rknightion/opnsense2otel"
repo_url = "https://github.com/rknightion/opnsense2otel"
edit_uri = "edit/main/docs/"
nav = [
  { Home = ["index.md"] },
  { "Getting Started" = "getting-started.md" },
  { Configuration = "configuration.md" },
  { "Deployment" = [
      "deployment.md",
      { "Docker & Compose" = "deployment/docker.md" },
      { "Compose Reference (every setting)" = "deployment/reference.md" },
      { "Kubernetes" = "deployment/kubernetes.md" },
      { "Systemd" = "deployment/systemd.md" }
    ] },
  { Security = "security.md" },
  { Collectors = [
      "collectors/index.md",
      { Reference = "collectors/reference.md" }
    ] },
  { "Metrics Reference" = [
      "metrics/index.md",
      { Overview = "metrics/overview.md" },
      { "Complete Reference" = "metrics/metrics.md" }
    ] },
  { "Integration & Dashboards" = "integration-dashboards.md" },
  { "Log Shipping" = [
      "log-shipping.md",
      { "Syslog Receiver" = "syslog-receiver.md" },
      { "Zenarmor Receiver" = "zenarmor-receiver.md" },
      { "Flow Volume" = "flow.md" },
      { "GeoIP Enrichment" = "geoip.md" },
      { "Native Log Export" = "log-export-native.md" },
      { "OTLP Attribute Contract" = "otlp-attribute-contract.md" }
    ] },
  { Troubleshooting = "troubleshooting.md" },
  { Upgrading = "upgrading.md" },
  { Compatibility = "compatibility.md" },
  { Architecture = "architecture.md" },
  { Changelog = "changelog.md" },
  { Development = [
      { Contributing = "development/contributing.md" },
      { "Adding a Collector" = "development/adding-collector.md" },
      { "Release Process" = "development/release-process.md" },
      { "API Landmines" = "development/api-landmines.md" },
      { "API-Absent Telemetry" = "development/api-absent-telemetry.md" }
    ] }
]
extra_css = ["stylesheets/extra.css", "stylesheets/brand.css"]
extra_javascript = [
  "javascripts/extra.js",
]
copyright = """<a href=\"https://m7kni.io\" target=\"_blank\" rel=\"noopener\">m7kni.io</a>"""

[project.theme]
language = "en"
custom_dir = "docs/overrides"
variant = "modern"
features = [
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.instant.progress",
  "navigation.tracking",
  "navigation.tabs",
  "navigation.tabs.sticky",
  "navigation.sections",
  "navigation.expand",
  "navigation.top",
  "navigation.footer",
  "navigation.indexes",
  "navigation.path",
  "search.suggest",
  "search.highlight",
  "search.share",
  "toc.follow",
  "toc.integrate",
  "content.code.copy",
  "content.code.select",
  "content.code.annotate",
  "content.tabs.link",
  "content.tooltips",
  "content.footnote.tooltips",
  "content.action.edit",
  "content.action.view"
]
favicon = "assets/favicon.png"

# Light is default; dark is toggle-only (m7kni.io fleet brand alignment).
[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "indigo"
accent = "indigo"
toggle.icon = "material/toggle-switch"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "indigo"
accent = "indigo"
toggle.icon = "material/toggle-switch-off-outline"
toggle.name = "Switch to light mode"

[project.theme.icon]
repo = "fontawesome/brands/github"
edit = "material/pencil"
view = "material/eye"
logo = "material/shield-lock-outline"

[project.plugins.privacy]

[project.plugins.social]

[project.plugins.sitemap]
changefreq = "weekly"
priority = 0.8

[project.plugins.meta]
meta_file = "**/.meta.yml"

[project.plugins.tags]

[project.plugins.minify]
minify_html = true
minify_js = true
minify_css = true
cache_safe = true

[project.plugins.minify.htmlmin_opts]
remove_comments = true

[project.plugins."git-revision-date-localized"]
enable_creation_date = true
type = "timeago"
custom_format = "%d. %B %Y"
timezone = "UTC"
locale = "en"
fallback_to_build_date = true
exclude = ["index.md"]

[project.plugins."git-committers"]
repository = "rknightion/opnsense2otel"
branch = "main"

[project.plugins."git-authors"]

[project.plugins.glightbox]
touchNavigation = true
loop = false
effect = "zoom"
width = "100%"
height = "auto"
zoomable = true
draggable = true
auto_caption = false
caption_position = "bottom"

[project.plugins."include-markdown"]

[project.markdown_extensions.abbr]

[project.markdown_extensions.admonition]

[project.markdown_extensions.attr_list]

[project.markdown_extensions.def_list]

[project.markdown_extensions.footnotes]

[project.markdown_extensions.md_in_html]

[project.markdown_extensions.tables]

[project.markdown_extensions.toc]
permalink = true
title = "On this page"
permalink_title = "Anchor link to this section for reference"

[project.markdown_extensions.pymdownx.arithmatex]
generic = true

[project.markdown_extensions.pymdownx.betterem]
smart_enable = "all"

[project.markdown_extensions.pymdownx.caret]

[project.markdown_extensions.pymdownx.details]

[project.markdown_extensions.pymdownx.emoji]
emoji_index = "zensical.extensions.emoji.twemoji"
emoji_generator = "zensical.extensions.emoji.to_svg"

[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true

[project.markdown_extensions.pymdownx.inlinehilite]

[project.markdown_extensions.pymdownx.keys]

[project.markdown_extensions.pymdownx.mark]

[project.markdown_extensions.pymdownx.smartsymbols]

[project.markdown_extensions.pymdownx.snippets]
auto_append = ["includes/abbreviations.md"]

[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" }
]

[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
combine_header_slug = true

[project.markdown_extensions.pymdownx.tabbed.slugify]
object = "pymdownx.slugs.slugify"
kwds = { case = "lower" }

[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true

[project.markdown_extensions.pymdownx.tilde]

[project.markdown_extensions.pymdownx.critic]

[project.markdown_extensions.pymdownx.blocks.admonition]
types = [
  "new",
  "settings",
  "note",
  "abstract",
  "info",
  "tip",
  "success",
  "question",
  "warning",
  "failure",
  "danger",
  "bug",
  "example",
  "quote"
]

[project.extra]
social_image = "assets/social-card.png"
social_image_alt = "opnsense2otel social preview card"
twitter_site = "@rknightion"
twitter_creator = "@rknightion"
theme_color = "#2563eb"
keywords = [
  "opnsense",
  "opnsense exporter",
  "prometheus exporter",
  "opentelemetry",
  "otlp",
  "firewall monitoring",
  "network monitoring",
  "syslog receiver",
  "netflow",
  "zenarmor",
  "loki",
  "grafana",
  "freebsd",
  "pf",
  "network security",
  "observability"
]

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/rknightion/opnsense2otel"
name = "GitHub Repository"

[project.extra.version]
provider = "mike"
default = "stable"

[project.extra.status]
new = "Recently added"
deprecated = "Deprecated"

[project.extra.tags]
Prometheus = "prometheus"
Docker = "docker"
Kubernetes = "kubernetes"
Monitoring = "monitoring"
Firewall = "firewall"
Configuration = "config"
Deployment = "deployment"
Troubleshooting = "troubleshooting"
FreeBSD = "freebsd"
OPNsense = "opnsense"
