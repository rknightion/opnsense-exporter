# Generated by build_rules.py — portable Prometheus rule groups.
# Alerts + recording rules for the OPNsense exporter. Datasource-agnostic.
groups:
  - name: "opnsense-exporter-alerts"
    rules:
      - alert: "OPNsenseExporterDown"
        expr: "opnsense_up < 1"
        for: "5m"
        labels:
          severity: "critical"
        annotations:
          summary: "OPNsense exporter/box down ({{ $labels.opnsense_instance }})"
          description: "opnsense_up has been 0 (or the target has been unreachable / NoData) for 5m."
          runbook_url: "https://github.com/rknightion/opnsense-exporter/blob/main/grafana/README.md#alerts"
      - alert: "OPNsenseFirewallUnhealthy"
        expr: "opnsense_firewall_status < 1"
        for: "10m"
        labels:
          severity: "warning"
        annotations:
          summary: "OPNsense firewall health check failing ({{ $labels.opnsense_instance }})"
          description: "opnsense_firewall_status has reported 0 (errors) for 10m."
          runbook_url: "https://github.com/rknightion/opnsense-exporter/blob/main/grafana/README.md#alerts"
      - alert: "OPNsenseCrashReports"
        expr: "opnsense_crash_reporter_status < 1"
        for: "5m"
        labels:
          severity: "warning"
        annotations:
          summary: "OPNsense crash reports present ({{ $labels.opnsense_instance }})"
          description: "opnsense_crash_reporter_status is 0 \u2014 one or more crash reports are present."
          runbook_url: "https://github.com/rknightion/opnsense-exporter/blob/main/grafana/README.md#alerts"
      - alert: "OPNsenseEndpointErrors"
        expr: "sum by (opnsense_instance, endpoint) (increase(opnsense_exporter_endpoint_errors_total[15m])) > 0"
        labels:
          severity: "warning"
        annotations:
          summary: "OPNsense exporter endpoint errors ({{ $labels.endpoint }})"
          description: "The {{ $labels.endpoint }} API endpoint returned errors in the last 15m. One alert per endpoint."
          runbook_url: "https://github.com/rknightion/opnsense-exporter/blob/main/grafana/README.md#alerts"
      - alert: "OPNsenseGatewayDown"
        expr: "opnsense_gateways_status < 1"
        for: "5m"
        labels:
          severity: "critical"
        annotations:
          summary: "OPNsense gateway {{ $labels.name }} is offline"
          description: "Gateway {{ $labels.name }} ({{ $labels.address }}) has been offline (status 0) for 5m."
          runbook_url: "https://github.com/rknightion/opnsense-exporter/blob/main/grafana/README.md#alerts"
      - alert: "OPNsenseGatewayHighLoss"
        expr: "opnsense_gateways_loss_percentage > 20"
        for: "10m"
        labels:
          severity: "warning"
        annotations:
          summary: "OPNsense gateway {{ $labels.name }} high packet loss"
          description: "Gateway {{ $labels.name }} packet loss > 20% for 10m (current {{ $values.A.Value | printf \"%.1f\" }}%)."
          runbook_url: "https://github.com/rknightion/opnsense-exporter/blob/main/grafana/README.md#alerts"
      - alert: "OPNsenseGatewayHighRTT"
        expr: "opnsense_gateways_rtt_milliseconds / (opnsense_gateways_rtt_high_milliseconds > 0) > 1"
        for: "10m"
        labels:
          severity: "warning"
        annotations:
          summary: "OPNsense gateway {{ $labels.name }} RTT over its high threshold"
          description: "Gateway {{ $labels.name }} mean RTT has exceeded its configured high-latency threshold for 10m."
          runbook_url: "https://github.com/rknightion/opnsense-exporter/blob/main/grafana/README.md#alerts"
      - alert: "OPNsensePFStateTableNearLimit"
        expr: "opnsense_firewall_pf_states_current / (opnsense_firewall_pf_states_limit > 0) > 0.9"
        for: "10m"
        labels:
          severity: "warning"
        annotations:
          summary: "OPNsense PF state table near its limit"
          description: "PF state table is over 90% of its configured limit for 10m."
          runbook_url: "https://github.com/rknightion/opnsense-exporter/blob/main/grafana/README.md#alerts"
      - alert: "OPNsenseMemoryHigh"
        expr: "opnsense_system_memory_used_bytes / (opnsense_system_memory_total_bytes > 0) > 0.9"
        for: "15m"
        labels:
          severity: "warning"
        annotations:
          summary: "OPNsense memory usage high ({{ $labels.opnsense_instance }})"
          description: "Physical memory usage has been above 90% for 15m."
          runbook_url: "https://github.com/rknightion/opnsense-exporter/blob/main/grafana/README.md#alerts"
      - alert: "OPNsenseDiskUsageHigh"
        expr: "opnsense_system_disk_usage_ratio > 0.9"
        for: "15m"
        labels:
          severity: "warning"
        annotations:
          summary: "OPNsense disk {{ $labels.mountpoint }} almost full"
          description: "Filesystem {{ $labels.mountpoint }} ({{ $labels.device }}) usage above 90% for 15m."
          runbook_url: "https://github.com/rknightion/opnsense-exporter/blob/main/grafana/README.md#alerts"
      - alert: "OPNsenseHighTemperature"
        expr: "opnsense_temperature_celsius > 85"
        for: "10m"
        labels:
          severity: "warning"
        annotations:
          summary: "OPNsense sensor {{ $labels.device }} hot"
          description: "Temperature sensor {{ $labels.device }} above 85\u00b0C for 10m."
          runbook_url: "https://github.com/rknightion/opnsense-exporter/blob/main/grafana/README.md#alerts"
      - alert: "OPNsenseSmartHealthFailed"
        expr: "opnsense_smart_device_health < 1"
        for: "5m"
        labels:
          severity: "critical"
        annotations:
          summary: "OPNsense SMART health failed on {{ $labels.device }}"
          description: "SMART overall-health for {{ $labels.device }} ({{ $labels.model }}) reports FAILED."
          runbook_url: "https://github.com/rknightion/opnsense-exporter/blob/main/grafana/README.md#alerts"
      - alert: "OPNsenseFirmwareNeedsReboot"
        expr: "opnsense_firmware_needs_reboot > 0"
        for: "30m"
        labels:
          severity: "warning"
        annotations:
          summary: "OPNsense needs a reboot ({{ $labels.opnsense_instance }})"
          description: "A firmware update flagged that OPNsense needs a reboot."
          runbook_url: "https://github.com/rknightion/opnsense-exporter/blob/main/grafana/README.md#alerts"
      - alert: "OPNsenseCertificateExpiringSoon"
        expr: "((opnsense_certificate_valid_to_seconds - time()) / 86400 > 0) and ((opnsense_certificate_valid_to_seconds - time()) / 86400 < 14)"
        labels:
          severity: "warning"
        annotations:
          summary: "OPNsense certificate expiring soon: {{ $labels.commonname }}"
          description: "Certificate {{ $labels.commonname }} ({{ $labels.description }}) expires within 14 days."
          runbook_url: "https://github.com/rknightion/opnsense-exporter/blob/main/grafana/README.md#alerts"
      - alert: "OPNsenseCertificateExpiringCritical"
        expr: "((opnsense_certificate_valid_to_seconds - time()) / 86400 > 0) and ((opnsense_certificate_valid_to_seconds - time()) / 86400 < 3)"
        labels:
          severity: "critical"
        annotations:
          summary: "OPNsense certificate expiring imminently: {{ $labels.commonname }}"
          description: "Certificate {{ $labels.commonname }} ({{ $labels.description }}) expires within 3 days."
          runbook_url: "https://github.com/rknightion/opnsense-exporter/blob/main/grafana/README.md#alerts"
      - alert: "OPNsenseServiceDown"
        expr: "opnsense_services_status < 1"
        for: "10m"
        labels:
          severity: "warning"
        annotations:
          summary: "OPNsense service {{ $labels.name }} stopped"
          description: "Service {{ $labels.name }} ({{ $labels.description }}) has been stopped for 10m. One alert per service."
          runbook_url: "https://github.com/rknightion/opnsense-exporter/blob/main/grafana/README.md#alerts"
      - alert: "OPNsenseNTPPeerUnreachable"
        expr: "opnsense_ntp_peer_reach < 1"
        for: "15m"
        labels:
          severity: "warning"
        annotations:
          summary: "OPNsense NTP peer {{ $labels.server }} unreachable"
          description: "NTP peer {{ $labels.server }} reachability register has been 0 for 15m."
          runbook_url: "https://github.com/rknightion/opnsense-exporter/blob/main/grafana/README.md#alerts"
      - alert: "OPNsenseUnboundDNSSECBogus"
        expr: "sum by (opnsense_instance) (increase(opnsense_unbound_dns_answers_bogus_total[15m])) > 5"
        labels:
          severity: "info"
        annotations:
          summary: "OPNsense Unbound DNSSEC bogus answers ({{ $labels.opnsense_instance }})"
          description: "More than 5 DNSSEC-bogus answers in 15m \u2014 possible misconfiguration or tampering."
          runbook_url: "https://github.com/rknightion/opnsense-exporter/blob/main/grafana/README.md#alerts"
  - name: "opnsense-exporter-recording"
    interval: "1m"
    rules:
      - record: "instance:opnsense_interface_rx_bits:rate5m"
        expr: "sum by (opnsense_instance, interface) (rate(opnsense_interfaces_received_bytes_total[5m])) * 8"
      - record: "instance:opnsense_interface_tx_bits:rate5m"
        expr: "sum by (opnsense_instance, interface) (rate(opnsense_interfaces_transmitted_bytes_total[5m])) * 8"
      - record: "instance:opnsense_firewall_block_packets:rate5m"
        expr: "sum by (opnsense_instance, interface) (rate(opnsense_firewall_in_ipv4_block_packets[5m]) + rate(opnsense_firewall_out_ipv4_block_packets[5m]) + rate(opnsense_firewall_in_ipv6_block_packets[5m]) + rate(opnsense_firewall_out_ipv6_block_packets[5m]))"
      - record: "instance:opnsense_pf_state:utilization"
        expr: "opnsense_firewall_pf_states_current / (opnsense_firewall_pf_states_limit > 0)"
      - record: "instance:opnsense_unbound_cache:hit_ratio"
        expr: "rate(opnsense_unbound_dns_cache_hits_total[5m]) / clamp_min(rate(opnsense_unbound_dns_cache_hits_total[5m]) + rate(opnsense_unbound_dns_cache_miss_total[5m]), 1)"
      - record: "instance:opnsense_unbound_queries:rate5m"
        expr: "rate(opnsense_unbound_dns_queries_total[5m])"
      - record: "instance:opnsense_gateway_loss:ratio"
        expr: "opnsense_gateways_loss_percentage / 100"
      - record: "instance:opnsense_system_mem:utilization"
        expr: "opnsense_system_memory_used_bytes / (opnsense_system_memory_total_bytes > 0)"
